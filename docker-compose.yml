services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codemind}
      POSTGRES_USER: ${POSTGRES_USER:-codemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemind_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codemind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codemind} -d ${POSTGRES_DB:-codemind}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - codemind-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codemind-postgres:
  codemind-redis:
